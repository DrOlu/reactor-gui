appId: com.reactor-gui.desktop
productName: reactor-gui
copyright: Copyright 2026 Hyperspace Technologies
electronVersion: 34.5.8

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: "${productName}-${version}-${arch}-portable.${ext}"

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: Development

publish:
  provider: github
  owner: DrOlu
  repo: reactor-gui
