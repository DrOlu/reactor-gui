appId: com.reactor-gui.desktop
productName: reactor-gui
copyright: Copyright 2026 Hyperspace Technologies
electronVersion: 34.5.8

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/icon.png
    to: icon.png

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/reactor-gui-notification-status-helper
      to: MacOS/reactor-gui-notification-status-helper

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: "${productName}-${version}-${arch}-portable.${ext}"

linux:
  icon: resources/icon.png
  executableName: reactor-gui
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: Development

toolsets:
  appimage: "1.0.2"

publish:
  provider: github
  owner: DrOlu
  repo: reactor-gui
