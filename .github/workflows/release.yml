name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  # ── macOS (arm64) ──────────────────────────────────────────────────────────
  release-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm --filter @pi-gui/desktop run build

      - name: Package (macOS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd apps/desktop
          pnpm exec electron-builder --mac \
            --publish never \
            "-c.extraMetadata.version=${GITHUB_REF_NAME#v}"

      - name: Release macOS artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false

  # ── Windows (x64) ──────────────────────────────────────────────────────────
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @pi-gui/desktop run build

      - name: Package (Windows)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd apps/desktop
          pnpm exec electron-builder --win `
            --publish never `
            "-c.extraMetadata.version=$($env:GITHUB_REF_NAME -replace '^v','')"

      - name: Release Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false

  # ── Linux (x64) ────────────────────────────────────────────────────────────
  release-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk1.0-dev libatk-bridge2.0-dev \
            libcups2-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libgbm-dev libxkbcommon-dev libpango1.0-dev libcairo2-dev \
            libasound2-dev libxshmfence-dev rpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @pi-gui/desktop run build

      - name: Package (Linux)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd apps/desktop
          pnpm exec electron-builder --linux \
            --publish never \
            "-c.extraMetadata.version=${GITHUB_REF_NAME#v}"

      - name: Release Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
